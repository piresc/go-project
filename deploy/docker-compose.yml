name: go-project

# Local stack. Run via `make up` (needs `make keys` first). Optional overrides
# go in deploy/.env (see .env.example).
#
# One Postgres database (app) with a schema and login role per service
# (users/user_svc, assets/asset_svc), and one Redis with a DB number per service
# (price 0, user 1, asset 2). No service reads another service's schema or
# Redis DB; Postgres enforces it through the per-service roles.
services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${NGINX_PORT:-8080}:8080"
    depends_on:
      user-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      price-service:
        condition: service_healthy

  user-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: user-service
        PORT: 8084
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD:-user-change-me}
      DB_DATABASE: app
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      JWT_PRIVATE_KEY_PATH: /keys/private.pem
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    volumes:
      - ../keys:/keys:ro
    expose:
      - "8084"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy

  asset-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: asset-service
        PORT: 8082
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: asset_svc
      DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset-change-me}
      DB_DATABASE: app
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../keys:/keys:ro
    expose:
      - "8082"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 35s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      price-service:
        condition: service_healthy

  price-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: price-service
        PORT: 8083
    environment:
      APP_ENV: local
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_PUBLIC_KEY_PATH: /keys/public.pem
    volumes:
      - ../keys:/keys:ro
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 35s
    depends_on:
      redis:
        condition: service_healthy
      market-mock:
        condition: service_started
      otel-lgtm:
        condition: service_started

  # Local stand-in for the upstream quotes API.
  market-mock:
    build:
      context: market-mock
    expose:
      - "8080"

  # Grafana (3000) + Tempo/Loki/Prometheus; OTLP gRPC arrives on 4317.
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    expose:
      - "4317"
    volumes:
      - lgtm_data:/data

  # The init script creates a login role and a schema per service on a fresh
  # volume (`make db-init` re-runs it); tables come from each service's own
  # migrations on startup.
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: app
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-user-change-me}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:-asset-change-me}
    expose:
      - "5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DB numbers: price-service 0 (asynq needs 0), user-service 1, asset-service 2.
  redis:
    image: redis:7.4.8-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.12.0-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    expose:
      - "4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lgtm_data:
  nats_data:
  postgres_app_data:
