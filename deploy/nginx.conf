worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting zone - 100 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    resolver 127.0.0.11 ipv6=off valid=5s;
    resolver_timeout 5s;

    server {
        listen 8080;

        # Security headers
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CORS headers are intentionally NOT set here: gokit's CorsHandler in
        # each service already sets them, and duplicates break browsers.

        # Route /api/v1/auth to user-service
        location /api/v1/auth {
            set $user_upstream user-service:8084;
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/v1/auth(.*)$ /auth$1 break;
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Route /api/v1/users to user-service
        location /api/v1/users {
            set $user_upstream user-service:8084;
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/v1/users(.*)$ /users$1 break;
            proxy_pass http://$user_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /api/v1/assets {
            set $asset_upstream asset-service:8082;
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/v1/assets(.*)$ /assets$1 break;
            proxy_pass http://$asset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /api/v1/portfolio {
            set $asset_upstream asset-service:8082;
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/v1/portfolio(.*)$ /portfolio$1 break;
            proxy_pass http://$asset_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location /api/v1/prices {
            set $price_upstream price-service:8083;
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/v1/prices(.*)$ /prices$1 break;
            proxy_pass http://$price_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location / {
            return 404;
        }
    }
}
