# Values below are defaults; override via env (DB_HOST, DB_PASSWORD, REDIS_HOST,
# NATS_URL, JWT_PUBLIC_KEY_PEM, ...).
app:
  name: asset-service
  environment: production
  version: 0.1.0

server:
  port: 8082
  shutdown_timeout: 30

logger:
  level: info
  format: json

database:
  host: postgres-asset
  port: 5432
  username: postgres
  password: ""
  database: assets
  ssl_mode: disable

redis:
  host: redis-asset
  port: 6379
  db: 0

nats:
  enabled: true
  url: nats://nats:4222

tracing:
  enabled: false

auth:
  public_key_pem: ""

service:
  auth:
    # Read-only token-revocation lookups against user-service's Redis.
    revocation_redis:
      host: redis-user
      port: 6379
  events:
    streams:
      - name: USERS
        subjects: ["user.>"]
    consumers:
      - name: asset-service-user-created
        stream: USERS
        subject: user.created
  http_clients:
    price:
      # Override per deployment with SERVICE_HTTP_CLIENTS_PRICE_BASE_URL.
      base_url: http://price-service:8083
      # 3 attempts x 1s stays under nginx's 5s proxy_read_timeout.
      timeout: 1s
