# Values below are defaults; override via env (REDIS_HOST, REDIS_PASSWORD,
# JWT_PUBLIC_KEY_PEM, SERVICE_HTTP_CLIENTS_MARKET_BASE_URL, ...).
app:
  name: price-service
  environment: production
  version: 0.1.0

server:
  port: 8083
  shutdown_timeout: 30

logger:
  level: info
  format: json

redis:
  host: redis
  port: 6379
  db: 0

nats:
  enabled: false

asynq:
  enabled: true

tracing:
  enabled: false

auth:
  public_key_pem: ""

service:
  auth:
    # Logout is enforced by user-service; elsewhere tokens live until expiry.
    skip_revocation_check: true
  tasks:
    schedules:
      - task: price:refresh
        cron: "@every 1m"
  http_clients:
    market:
      # Must be set per deployment: SERVICE_HTTP_CLIENTS_MARKET_BASE_URL.
      # The key stays here so the env var can override it.
      base_url: ""
