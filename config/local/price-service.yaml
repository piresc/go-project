app:
  name: price-service
  environment: local
  version: 0.1.0

server:
  port: 8083
  shutdown_timeout: 30

logger:
  level: debug
  format: text

redis:
  host: localhost
  port: 6379
  db: 0

nats:
  enabled: false

asynq:
  enabled: true

tracing:
  enabled: true
  exporter: otlp-grpc
  otlp_endpoint: otel-lgtm:4317
  sample_rate: 1.0

auth:
  public_key_path: keys/public.pem

service:
  auth:
    # Logout is enforced by user-service; elsewhere tokens live until expiry.
    skip_revocation_check: true
  tasks:
    schedules:
      - task: price:refresh
        cron: "@every 15s"
  http_clients:
    market:
      base_url: http://market-mock:8080
