app:
  name: asset-service
  environment: local
  version: 0.1.0

server:
  port: 8082
  shutdown_timeout: 30

logger:
  level: debug
  format: text

database:
  host: localhost
  port: 5432
  username: asset_svc
  password: asset-change-me
  database: app
  ssl_mode: disable

redis:
  host: localhost
  port: 6379
  db: 2

nats:
  enabled: true
  url: nats://localhost:4222

tracing:
  enabled: true
  exporter: otlp-grpc
  otlp_endpoint: otel-lgtm:4317
  sample_rate: 1.0

auth:
  public_key_path: keys/public.pem

service:
  auth:
    # Logout is enforced by user-service; elsewhere tokens live until expiry.
    skip_revocation_check: true
  events:
    streams:
      - name: USERS
        subjects: ["user.>"]
    consumers:
      - name: asset-service-user-created
        stream: USERS
        subject: user.created
  http_clients:
    price:
      base_url: http://price-service:8083
      # 3 attempts x 1s stays under nginx's 5s proxy_read_timeout.
      timeout: 1s
