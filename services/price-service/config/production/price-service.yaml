# Values below are defaults; override via env (REDIS_HOST, REDIS_PASSWORD,
# NATS_URL, JWT_PUBLIC_KEY_PEM, ...).
app:
  name: price-service
  environment: production
  version: 0.1.0

server:
  port: 8083
  shutdown_timeout: 30

logger:
  level: info
  format: json

redis:
  host: redis
  port: 6379
  db: 0

nats:
  enabled: true
  url: nats://nats:4222

auth:
  public_key_pem: ""
